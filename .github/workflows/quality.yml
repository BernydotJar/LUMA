name: Product quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - name: Prepare the exact committed release source
        run: node scripts/release/prepare.mjs
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
      - name: Build the exact archive that Firebase will receive
        run: |
          mkdir -p "$RUNNER_TEMP/release-build"
          unzip -q "$RUNNER_TEMP/release/source.zip" -d "$RUNNER_TEMP/release-build"
          cd "$RUNNER_TEMP/release-build"
          npm ci --no-audit --no-fund
          npm run build
      - name: Preserve the production build for browser verification
        run: tar -C "$RUNNER_TEMP/release-build" -czf "$RUNNER_TEMP/production-build.tgz" .next
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-build.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/source.zip
            ${{ runner.temp }}/release/manifest.json
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Run stateful Firestore integration gates
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-commerce
          --only firestore
          "npm run test:run --
          src/lib/commerce/ledger.emulator.test.ts
          src/lib/commerce/orchestrator.emulator.test.ts
          src/lib/commerce/institutional-grant.emulator.test.ts
          src/lib/program-delivery.emulator.test.ts
          src/lib/learning-store.emulator.test.ts
          src/lib/live-classroom-attendance.emulator.test.ts"

  identity-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Exercise role grant, token revocation, and Firestore audit
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-role-provisioning
          --only auth,firestore
          "npm run test:run --
          src/lib/tenant-admin-auth.emulator.test.ts
          src/lib/institutions/draft-store.emulator.test.ts
          src/lib/institutions/draft-route.emulator.test.ts
          src/lib/institutions/publication-preflight.emulator.test.ts
          src/lib/institutions/publication-route.emulator.test.ts
          src/lib/institutions/publication-plan-store.emulator.test.ts
          src/lib/institutions/publication-plan-route.emulator.test.ts
          --maxWorkers=1"


  # Source QA checks match protected main contexts and run real regressions.
  coach-rbac:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify role denial and coach-scoped learner evidence
        run: >-
          npm run test:run --
          src/lib/coach-access.test.ts
          src/lib/coach-scoped-learning.test.ts
          src/lib/coach-data-status.test.ts

  institution-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Validate bulk admission, CSV and grant controls
        run: >-
          npm run test:run --
          src/lib/commerce/institutional-bulk.test.ts
          src/lib/commerce/institutional-csv.test.ts
          src/lib/commerce/institutional-grants.test.ts
      - name: Verify institutional grant persistence in an isolated emulator
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-ci-institution-intake
          --only firestore
          "npm run test:run -- src/lib/commerce/institutional-grant.emulator.test.ts --maxWorkers=1"

  institution-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Verify institution scope and review plan inputs
        run: >-
          npm run test:run --
          src/lib/institutions/draft-access.test.ts
          src/lib/institutions/draft-input.test.ts
          src/lib/institutions/publication-plan-input.test.ts
      - name: Verify separate reviewer, stale revision and tenant denials
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-ci-institution-approval
          --only auth,firestore
          "npm run test:run --
          src/lib/institutions/publication-plan-store.emulator.test.ts
          src/lib/institutions/publication-plan-route.emulator.test.ts
          --maxWorkers=1"

  institution-browser:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-build
      - name: Unpack exact verified Next.js build
        run: tar -xzf "$RUNNER_TEMP/verified-build/production-build.tgz"
      - name: Verify institutional UI and API authorization in Chromium
        run: npx playwright test e2e/enterprise-boundary.spec.ts --project chromium
        env:
          CI: "true"

  # This is a technical smoke, not authenticated customer/LiveKit Cloud UAT.
  learning-auth-uat:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Exercise Auth/Firestore learning and identity controls
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-ci-learning-auth
          --only auth,firestore
          "npm run test:run --
          src/lib/learning-store.emulator.test.ts
          src/lib/program-delivery.emulator.test.ts
          src/lib/tenant-admin-auth.emulator.test.ts
          --maxWorkers=1"
      - name: Check learner authorization and entitlement handling
        run: >-
          npm run test:run --
          src/lib/learning-server.auth.test.ts
          src/lib/learning-entitlement.test.ts
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-build
      - name: Unpack exact verified Next.js build
        run: tar -xzf "$RUNNER_TEMP/verified-build/production-build.tgz"
      - name: Verify login and guest classroom boundaries in Chromium
        run: npx playwright test e2e/auth.spec.ts e2e/live-classroom-auth.spec.ts --project chromium
        env:
          CI: "true"

  browser:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-build
      - run: tar -xzf "$RUNNER_TEMP/verified-build/production-build.tgz"
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            evidence/playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14

  # Minimal trust-plane bootstrap: block every production rollout until a
  # trusted, exact-SHA Ed25519 release attestation exists. All source-review
  # scripts run fail-closed, and the protected signer is dispatched only on main.

  product-acceptance-contract:
    name: Operational acceptance contract self-test (not a release approval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Adversarial product acceptance contract tests
        run: node --test scripts/qa/product-acceptance-contract-checks.mjs
      - name: Run negative inventory to demonstrate customer journeys are not approved
        run: node scripts/qa/product-acceptance-gate.mjs --phase inventory
      - name: Confirm incomplete product is blocked even with CI green
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync("evidence/product-acceptance-2026-10-19/operational-readiness.json","utf8"));
          if (p.phase !== "inventory" || p.verdict !== "BLOCKED" || p.releaseAllowed !== false ||
              p.modules.length !== 9 || p.journeys.length !== 5) process.exit(1);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-acceptance-inventory-${{ github.run_attempt }}
          path: evidence/product-acceptance-2026-10-19/operational-readiness.json
          if-no-files-found: warn
          retention-days: 14

  product-acceptance-predeploy:
    needs: [verify, product-acceptance-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'BernydotJar/LUMA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: enterprise-product-acceptance
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Require protected independently generated UAT artifacts
        env:
          UAT_RUN_ID: ${{ vars.LUMA_ACCEPTANCE_ARTIFACT_RUN_ID }}
        run: |
          test -n "$UAT_RUN_ID"
          test "$UAT_RUN_ID" -gt 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: luma-acceptance-private-evidence
          repository: BernydotJar/LUMA
          run-id: ${{ vars.LUMA_ACCEPTANCE_ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/luma-protected-acceptance/artifacts
      - name: Load independent acceptance trust and signed receipts from protected secrets
        env:
          LUMA_ACCEPTANCE_TRUST_STORE_B64: ${{ secrets.LUMA_ACCEPTANCE_TRUST_STORE_B64 }}
          LUMA_ACCEPTANCE_SIGNED_RECEIPTS_B64: ${{ secrets.LUMA_ACCEPTANCE_SIGNED_RECEIPTS_B64 }}
        run: node scripts/qa/protected-acceptance-inputs.mjs
      - name: Fail closed unless the complete signed product acceptance is valid
        run: >-
          node scripts/qa/product-acceptance-gate.mjs
          --phase predeploy
          --receipts "$LUMA_ACCEPTANCE_RECEIPTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-product-acceptance-${{ github.run_attempt }}
          path: evidence/product-acceptance-2026-10-19/operational-readiness.json
          if-no-files-found: warn
          retention-days: 30

  release-readiness:
    needs: [verify, security, firestore, identity-roles, browser, coach-rbac, institution-intake, institution-browser, institution-approval, learning-auth-uat, product-acceptance-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify protected exact-source review and signed Graph release gate
        env:
          LUMA_RELEASE_ATTESTATION_PUBLIC_KEY_B64: ${{ vars.LUMA_RELEASE_ATTESTATION_PUBLIC_KEY_B64 }}
        run: node scripts/release/pr-readiness.mjs

  deploy:
    needs: [verify, security, firestore, identity-roles, browser, coach-rbac, institution-intake, institution-browser, institution-approval, learning-auth-uat, product-acceptance-contract, product-acceptance-predeploy, release-readiness]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'BernydotJar/LUMA'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://luma--luma-learning-intelligence.us-central1.hosted.app
    concurrency:
      group: luma-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Initialize the runner-local release directory
        run: echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Verify keyless deployment configuration
        env:
          PROVIDER: ${{ vars.LUMA_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.LUMA_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: luma-learning-intelligence
          workload_identity_provider: ${{ vars.LUMA_WIF_PROVIDER }}
          service_account: ${{ vars.LUMA_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy the validated source to the existing backend
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/apphosting.mjs deploy
      - name: Verify production SHA, routes, roles, appearance, and navigation
        run: node scripts/release/smoke.mjs
      # Promotion remains reversible until the real signed customer journeys
      # have passed against the published SHA and observed public interface.
      - name: Require protected independently generated production UAT artifacts
        env:
          UAT_RUN_ID: ${{ vars.LUMA_ACCEPTANCE_ARTIFACT_RUN_ID }}
        run: |
          test -n "$UAT_RUN_ID"
          test "$UAT_RUN_ID" -gt 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: luma-acceptance-private-evidence
          repository: BernydotJar/LUMA
          run-id: ${{ vars.LUMA_ACCEPTANCE_ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/luma-protected-acceptance/artifacts
      - name: Read protected customer receipt and reviewer trust material
        env:
          LUMA_ACCEPTANCE_TRUST_STORE_B64: ${{ secrets.LUMA_ACCEPTANCE_TRUST_STORE_B64 }}
          LUMA_ACCEPTANCE_SIGNED_RECEIPTS_B64: ${{ secrets.LUMA_ACCEPTANCE_SIGNED_RECEIPTS_B64 }}
        run: node scripts/qa/protected-acceptance-inputs.mjs
      - name: Observe deployed customer routes and exact public SHA
        run: node scripts/qa/product-public-inventory.mjs
      - name: Require signed postdeploy product acceptance before finalization
        run: >-
          node scripts/qa/product-acceptance-gate.mjs
          --phase postdeploy
          --receipts "$LUMA_ACCEPTANCE_RECEIPTS"
      - name: Validate rollback without changing live traffic
        run: node scripts/release/apphosting.mjs rollback-validate
      - name: Finalize verified release
        run: node scripts/release/apphosting.mjs finalize
      - name: Restore previous verified revision after failure when safe
        if: failure() && steps.promote.outcome != 'skipped'
        run: |
          if test -f "$RELEASE_DIR/release-result.json"; then
            node scripts/release/apphosting.mjs recover
          fi
      - name: Publish release decision
        if: always()
        run: |
          if test -f "$RELEASE_DIR/release-result.json"; then
            node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RELEASE_DIR+"/release-result.json"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## LUMA release\nStatus: ${r.status}\nCommit: ${r.gitSha}\nBuild: ${r.buildId ?? "not created"}\n`);'
          else
            echo '## Release blocked before promotion' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/release-result.json
            ${{ runner.temp }}/release/smoke.json
            ${{ runner.temp }}/release/screenshots
          if-no-files-found: error
          retention-days: 90
