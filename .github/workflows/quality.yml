name: Product quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check source-review bootstrap invariants
        run: python3 -m unittest discover -s scripts/release -p quality_run_test.py
      - run: npm run test:run
      - name: Prepare the exact committed release source
        run: node scripts/release/prepare.mjs
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
      - name: Build the exact archive that Firebase will receive
        run: |
          mkdir -p "$RUNNER_TEMP/release-build"
          unzip -q "$RUNNER_TEMP/release/source.zip" -d "$RUNNER_TEMP/release-build"
          cd "$RUNNER_TEMP/release-build"
          npm ci --no-audit --no-fund
          npm run build
      - name: Preserve the production build for browser verification
        run: tar -C "$RUNNER_TEMP/release-build" -czf "$RUNNER_TEMP/production-build.tgz" .next
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-build.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/source.zip
            ${{ runner.temp }}/release/manifest.json
          if-no-files-found: error
          retention-days: 30

  product-acceptance-contract:
    # PASS here verifies the fail-closed RULES, not business/product readiness.
    name: Operational acceptance contract self-test (not a release approval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Adversarial product acceptance contract tests
        run: node --test scripts/qa/product-acceptance-contract-checks.mjs
      - name: Report operational readiness without allowing an E2E count to certify a product
        run: node scripts/qa/product-acceptance-gate.mjs --phase inventory
      - name: Make the acceptance BLOCKED verdict explicit
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("evidence/product-acceptance-2026-10-19/operational-readiness.json", "utf8"));
          if(report.phase !== "inventory" || report.verdict !== "BLOCKED" || report.releaseAllowed !== false ||
             report.modules.length !== 9 || report.journeys.length !== 5 ||
             report.modules.flatMap(m=>m.actions).length !== 27)process.exit(1);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Operational product readiness — ${report.verdict} (NOT an approval)\n`+
            `Required modules: ${report.modules.length}; actions: 27; complete customer journeys: ${report.journeys.length}.\n`+
            `Source commit: ${report.candidateSha}; observed published commit: ${report.observedProductionSha ?? "unknown"}.\n`+
            `A successful CI test here attests only the **evaluator logic**, not the product.\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: operational-acceptance-inventory-${{ github.run_attempt }}
          path: evidence/product-acceptance-2026-10-19/operational-readiness.json
          if-no-files-found: warn
          retention-days: 14

  product-acceptance-predeploy:
    # Real production promotion HALTS until the customer, SDET and human owners
    # have independently signed every full business action. No auto approval.
    needs: [verify, product-acceptance-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'BernydotJar/LUMA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: enterprise-product-acceptance
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify and materialize environment-protected evidence (no repo-supplied keys)
        env:
          LUMA_ACCEPTANCE_TRUST_STORE_B64: ${{ secrets.LUMA_ACCEPTANCE_TRUST_STORE_B64 }}
          LUMA_ACCEPTANCE_SIGNED_RECEIPTS_B64: ${{ secrets.LUMA_ACCEPTANCE_SIGNED_RECEIPTS_B64 }}
        run: node scripts/qa/protected-acceptance-inputs.mjs
      - name: Enforce candidate completeness and protected source/signature approvals
        run: >-
          node scripts/qa/product-acceptance-gate.mjs
          --phase predeploy
          --receipts "$LUMA_ACCEPTANCE_RECEIPTS"
      - name: Record strictly non-release candidate verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enterprise-predeploy-acceptance-${{ github.run_attempt }}
          path: evidence/product-acceptance-2026-10-19/operational-readiness.json
          if-no-files-found: warn
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Run stateful Firestore integration gates
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-commerce
          --only firestore
          "npm run test:run --
          src/lib/commerce/ledger.emulator.test.ts
          src/lib/commerce/orchestrator.emulator.test.ts
          src/lib/commerce/institutional-grant.emulator.test.ts
          src/lib/program-delivery.emulator.test.ts
          src/lib/learning-store.emulator.test.ts
          src/lib/course-delivery.emulator.test.ts
          src/lib/certificates/eligibility.emulator.test.ts
          src/lib/live-classroom-attendance.emulator.test.ts"

  # Authenticated program assessment UAT: disposable Auth/Firestore only.
  learning-auth-uat:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Remove old receipts; never reuse committed PASS
        run: rm -f evidence/learning-ui/qa-authorized-learning-uat.json
      - name: Authenticate, assess, change program, revoke and exercise tutor in Chromium
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-learning-uat-20261020
          --only auth,firestore
          "bash scripts/qa/run-learning-assessment-uat.sh"
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Require current-source nonproduction receipt for all 13 scenarios
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("evidence/learning-ui/qa-authorized-learning-uat.json", "utf8"));
          assert.equal(report.sourceSha, process.env.GITHUB_SHA);
          assert.equal(report.decision, "TECHNICAL_QA_PASS_RELEASE_NO_GO");
          assert.equal(report.neverProduction, true);
          assert.equal(report.signedIndependentReviewer, false);
          assert.equal(report.realRagBackendValidated, false);
          assert.equal(report.passed, 13);
          assert.equal(report.failed, 0);
          assert.equal(report.defects.length, 0);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: learning-auth-uat-${{ github.run_attempt }}
          path: evidence/learning-ui/qa-authorized-learning-uat.json
          if-no-files-found: warn
          retention-days: 14

  identity-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Exercise role grant, token revocation, and Firestore audit
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-role-provisioning
          --only auth,firestore
          "npm run test:run --
          src/lib/tenant-admin-auth.emulator.test.ts
          src/lib/institutions/draft-store.emulator.test.ts
          src/lib/institutions/draft-route.emulator.test.ts
          src/lib/institutions/publication-preflight.emulator.test.ts
          src/lib/institutions/publication-route.emulator.test.ts
          src/lib/institutions/publication-plan-store.emulator.test.ts
          src/lib/institutions/publication-plan-route.emulator.test.ts
          --maxWorkers=1"

  coach-rbac:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-build
      - name: Unpack exact verified production build
        run: tar -xzf "$RUNNER_TEMP/verified-build/production-build.tgz"
      - name: Require freshly generated emulator evidence (never reuse committed PASS)
        run: rm -f evidence/first-client-coach-rbac-2026-10-14/api-results.json
      - name: Verify first-client coach RBAC on disposable Auth and Firestore emulators
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-firstclient-20261014
          --only auth,firestore
          "bash scripts/qa/first-client-emulator-gate.sh"
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Validate the freshly generated security receipt
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const file = "evidence/first-client-coach-rbac-2026-10-14/api-results.json";
          const report = JSON.parse(fs.readFileSync(file, "utf8"));
          if (report.status !== "PASS" || report.summary.passed !== 16 || report.summary.failed !== 0) {
            process.exitCode = 1;
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-client-coach-rbac-${{ github.run_attempt }}
          path: evidence/first-client-coach-rbac-2026-10-14/api-results.json
          if-no-files-found: warn
          retention-days: 14

  institution-intake:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-build
      - name: Unpack exact verified build for applicant-intake test
        run: tar -xzf "$RUNNER_TEMP/verified-build/production-build.tgz"
      - name: Reject stale committed intake evidence
        run: rm -f evidence/first-client-institution-request-2026-10-14/api-results.json
      - name: Test unprivileged academy applicant and Firestore transaction boundaries
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-firstclient-intake-20261014
          --only auth,firestore
          "bash scripts/qa/first-client-institution-gate.sh"
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          LUMA_INTAKE_SOURCE_SHA: ${{ github.sha }}
      - name: Require freshly generated applicant authorization receipt
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "evidence/first-client-institution-request-2026-10-14/api-results.json";
          const x = JSON.parse(fs.readFileSync(path, "utf8"));
          if (x.status !== "PASS" || x.summary.passed !== 13 || x.summary.failed !== 0 ||
              x.sourceSHA !== process.env.GITHUB_SHA) {
            process.exitCode = 1;
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-client-intake-${{ github.run_attempt }}
          path: evidence/first-client-institution-request-2026-10-14/api-results.json
          if-no-files-found: warn
          retention-days: 14

  institution-approval:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-build
      - name: Unpack exactly verified production build
        run: tar -xzf "$RUNNER_TEMP/verified-build/production-build.tgz"
      - name: Remove committed local QA evidence before execution
        run: rm -f evidence/first-client-approval-2026-10-18/api-results.json
      - name: Verify independent two-person approval, invitation, claims, tenant and privacy boundaries
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-firstclient-approval-20261018
          --only auth,firestore
          "bash scripts/qa/first-client-approval-gate.sh"
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          LUMA_QA_COMMIT: ${{ github.sha }}
      - name: Validate exact-current-SHA sanitized approval receipt
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("evidence/first-client-approval-2026-10-18/api-results.json", "utf8"));
          const observed = new Set(report.checks?.filter(x => x.result === "PASS").map(x => x.id) || []);
          if (report.status !== "PASS" || report.summary?.passed !== 20 ||
              report.summary?.failed !== 0 || report.sourceSha !== process.env.GITHUB_SHA ||
              !["05", "09", "11", "12", "14", "15", "16", "18", "19", "20"].every(n =>
                [...observed].some(x => x.startsWith(n + " ")))) {
            process.exitCode = 1;
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-client-approval-${{ github.run_attempt }}
          path: evidence/first-client-approval-2026-10-18/api-results.json
          if-no-files-found: warn
          retention-days: 14

  institution-browser:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare QA-only browser checkout (never part of release source)
        shell: bash
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/LUMA-firstclient-intake-uiqa-20261014"
          git worktree add --detach "$qa" HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" "$qa/node_modules"
          cd "$qa"
          source_dir="$GITHUB_WORKSPACE/evidence/first-client-institution-request-2026-10-14/browser/qa-tools"
          # #50 already provides a development-only Firebase Auth emulator
          # client guarded by a demo-* project and loopback URL. Never overlay
          # its source with an obsolete patch from #66 or change release code.
          node - <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const client = fs.readFileSync("src/lib/firebase-client.ts", "utf8");
          const layout = fs.readFileSync("src/app/layout.tsx", "utf8");
          for (const proof of ["localQaAuthEnabled", "NEXT_PUBLIC_LUMA_QA_FIREBASE_PROJECT", "NEXT_PUBLIC_LUMA_QA_AUTH_EMULATOR_URL", 'process.env.NODE_ENV === "development"']) {
            assert.ok(client.includes(proof), `Missing guarded emulator client: ${proof}`);
          }
          assert.ok(layout.includes('process.env.NODE_ENV === "development"'), "QA auth bridge must be dev-only");
          assert.ok(layout.includes("NEXT_PUBLIC_LUMA_QA_FIREBASE_PROJECT"), "QA auth must be demo-project-scoped");
          NODE
          mkdir -p src/app/qa-emulator-login scripts/qa
          cp "$source_dir/emulator-login.tsx.txt" src/app/qa-emulator-login/page.tsx
          cp "$source_dir/browser.mjs" scripts/qa/first-client-institution-browser.mjs
          cp "$source_dir/browser-gate.sh" scripts/qa/first-client-institution-browser-gate.sh
          chmod +x scripts/qa/first-client-institution-browser-gate.sh
          test -L node_modules
          test "$(git status --porcelain | wc -l)" -ge 2
          rm -rf evidence/first-client-institution-browser-2026-10-14
      - name: Run actual authenticated Chromium E2E with synthetic Firebase identity
        working-directory: ${{ runner.temp }}/LUMA-firstclient-intake-uiqa-20261014
        run: >-
          npx --yes firebase-tools@15.30.2
          emulators:exec
          --project demo-luma-firstclient-intake-20261014
          --only auth,firestore
          "bash scripts/qa/first-client-institution-browser-gate.sh"
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Enforce current-run WCAG multi-theme and applicant-isolation results
        working-directory: ${{ runner.temp }}/LUMA-firstclient-intake-uiqa-20261014
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("evidence/first-client-institution-browser-2026-10-14/results.json", "utf8"));
          const checks = report.checks || [];
          if (report.status !== "PASS" || report.summary?.passed !== 8 || report.summary?.failed !== 0 ||
              report.consoleErrors?.length !== 0 ||
              !checks.some(x => x.name.includes("WCAG 2.2") && x.status === "PASS") ||
              !checks.some(x => x.name.includes("different academy applicant") && x.status === "PASS")) {
            process.exitCode = 1;
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-client-intake-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/LUMA-firstclient-intake-uiqa-20261014/evidence/first-client-institution-browser-2026-10-14/
          if-no-files-found: warn
          retention-days: 14

  browser:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-build
      - run: tar -xzf "$RUNNER_TEMP/verified-build/production-build.tgz"
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            evidence/playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14

  release-readiness:
    # The independent source signature remains mandatory. The authenticated
    # learning UAT is an additional prerequisite, never a replacement.
    needs: [verify, security, firestore, identity-roles, browser, coach-rbac, institution-intake, institution-browser, institution-approval, learning-auth-uat]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enforce the exact-source independent Graph release approval
        env:
          LUMA_RELEASE_ATTESTATION_PUBLIC_KEY_B64: ${{ vars.LUMA_RELEASE_ATTESTATION_PUBLIC_KEY_B64 }}
        run: node scripts/release/pr-readiness.mjs

  deploy:
    # Do not authorize production on CI, emulator UAT, or inventory alone.
    # Source, authenticated learning UAT and human-signed enterprise product
    # acceptance are three independent required gates.
    needs: [verify, security, firestore, identity-roles, browser, coach-rbac, institution-intake, institution-browser, institution-approval, learning-auth-uat, product-acceptance-contract, product-acceptance-predeploy, release-readiness]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'BernydotJar/LUMA'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LUMA_RELEASE_ATTESTATION_PUBLIC_KEY_B64: ${{ vars.LUMA_RELEASE_ATTESTATION_PUBLIC_KEY_B64 }}
    environment:
      name: production
      url: https://luma--luma-learning-intelligence.us-central1.hosted.app
    concurrency:
      group: luma-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Initialize the runner-local release directory
        run: echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Verify keyless deployment configuration
        env:
          PROVIDER: ${{ vars.LUMA_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.LUMA_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER"
          test -n "$SERVICE_ACCOUNT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: luma-learning-intelligence
          workload_identity_provider: ${{ vars.LUMA_WIF_PROVIDER }}
          service_account: ${{ vars.LUMA_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy the validated source to the existing backend
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/apphosting.mjs deploy
      - name: Verify production SHA, routes, roles, appearance, and navigation
        run: node scripts/release/smoke.mjs
      - name: Validate rollback without changing live traffic
        run: node scripts/release/apphosting.mjs rollback-validate
      - name: Finalize verified release
        run: node scripts/release/apphosting.mjs finalize
      - name: Restore previous verified revision after failure when safe
        if: failure() && steps.promote.outcome != 'skipped'
        run: |
          if test -f "$RELEASE_DIR/release-result.json"; then
            node scripts/release/apphosting.mjs recover
          fi
      - name: Publish release decision
        if: always()
        run: |
          if test -f "$RELEASE_DIR/release-result.json"; then
            node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RELEASE_DIR+"/release-result.json"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## LUMA release\nStatus: ${r.status}\nCommit: ${r.gitSha}\nBuild: ${r.buildId ?? "not created"}\n`);'
          else
            echo '## Release blocked before promotion' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/release-result.json
            ${{ runner.temp }}/release/smoke.json
            ${{ runner.temp }}/release/screenshots
          if-no-files-found: error
          retention-days: 90
