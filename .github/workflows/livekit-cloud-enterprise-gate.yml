name: LiveKit Cloud enterprise acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-cloud-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: livekit-acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify LiveKit Cloud, no stored learner data
        run: node scripts/qa/livekit-cloud-enterprise-gate.mjs
        env:
          LIVEKIT_CLOUD_TEST_URL: ${{ secrets.LIVEKIT_CLOUD_TEST_URL }}
          LIVEKIT_CLOUD_TEST_API_KEY: ${{ secrets.LIVEKIT_CLOUD_TEST_API_KEY }}
          LIVEKIT_CLOUD_TEST_API_SECRET: ${{ secrets.LIVEKIT_CLOUD_TEST_API_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: livekit-cloud-enterprise-evidence
          path: evidence/live-classroom-acceptance/cloud-enterprise-verification.json
          if-no-files-found: warn
          retention-days: 14
