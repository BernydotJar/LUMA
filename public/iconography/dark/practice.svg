<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Practice — Nocturne Intelligence</title>
  <desc id="desc">Premium abstract icon: Refractive prism.</desc>
  
    <defs>
      <linearGradient id="g-practice" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#EFC86A"/>
        <stop offset="0.62" stop-color="#D97B4B"/>
        <stop offset="1" stop-color="#5B3037"/>
      </linearGradient>
      <linearGradient id="glass-practice" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.78"/>
        <stop offset="0.45" stop-color="#342124" stop-opacity="0.34"/>
        <stop offset="1" stop-color="#EFC86A" stop-opacity="0.14"/>
      </linearGradient>
      <radialGradient id="orb-practice" cx="32%" cy="24%" r="78%">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
        <stop offset="0.16" stop-color="#EFC86A"/>
        <stop offset="0.62" stop-color="#D97B4B"/>
        <stop offset="1" stop-color="#5B3037"/>
      </radialGradient>
      <filter id="shadow-practice" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5B3037" flood-opacity="0.18"/>
      </filter>
      <filter id="blur-practice" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
    </defs>
    
  <rect width="256" height="256" rx="64" fill="#24181A"/>
  <circle cx="206" cy="42" r="78" fill="#D97B4B" opacity="0.10" filter="url(#blur-practice)"/>
  <circle cx="42" cy="216" r="72" fill="#EFC86A" opacity="0.10" filter="url(#blur-practice)"/>
  <rect x="20" y="20" width="216" height="216" rx="52" fill="url(#glass-practice)" stroke="#FFF5DF" stroke-opacity="0.58"/>
  
  <g filter="url(#shadow-practice)">
    <path d="M128 58 187 166H69Z" fill="url(#g-practice)" stroke="#FFF" stroke-opacity=".54" stroke-width="2"/>
    <path d="m57 123 66 7" stroke="#EFC86A" stroke-width="6" stroke-linecap="round" opacity=".72"/>
    <path d="m133 131 66-28" stroke="#9DAC78" stroke-width="5" stroke-linecap="round" opacity=".78"/>
    <path d="m133 135 69 14" stroke="#D97B4B" stroke-width="5" stroke-linecap="round" opacity=".74"/>
    <path d="m115 90 22 78" stroke="#FFF" stroke-opacity=".30" stroke-width="3"/>
