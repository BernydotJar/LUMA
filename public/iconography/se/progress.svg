<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Progress — Seres de Excelencia</title>
  <desc id="desc">Premium abstract icon: Orbital field.</desc>
  
    <defs>
      <linearGradient id="g-progress" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#00A2F1"/>
        <stop offset="0.62" stop-color="#FF438C"/>
        <stop offset="1" stop-color="#993366"/>
      </linearGradient>
      <linearGradient id="glass-progress" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.78"/>
        <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.34"/>
        <stop offset="1" stop-color="#00A2F1" stop-opacity="0.14"/>
      </linearGradient>
      <radialGradient id="orb-progress" cx="32%" cy="24%" r="78%">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
        <stop offset="0.16" stop-color="#00A2F1"/>
        <stop offset="0.62" stop-color="#FF438C"/>
        <stop offset="1" stop-color="#993366"/>
      </radialGradient>
      <filter id="shadow-progress" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#993366" flood-opacity="0.18"/>
      </filter>
      <filter id="blur-progress" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
    </defs>
    
  <rect width="256" height="256" rx="64" fill="#F7FBFE"/>
  <circle cx="206" cy="42" r="78" fill="#FF438C" opacity="0.10" filter="url(#blur-progress)"/>
  <circle cx="42" cy="216" r="72" fill="#00A2F1" opacity="0.10" filter="url(#blur-progress)"/>
  <rect x="20" y="20" width="216" height="216" rx="52" fill="url(#glass-progress)" stroke="#FFFFFF" stroke-opacity="0.58"/>
  
  <g filter="url(#shadow-progress)">
    <circle cx="128" cy="128" r="47" fill="url(#orb-progress)"/>
    <ellipse cx="128" cy="128" rx="82" ry="31" fill="none" stroke="#993366" stroke-opacity=".34" stroke-width="3" transform="rotate(-13 128 128)"/>
    <ellipse cx="128" cy="128" rx="78" ry="28" fill="none" stroke="#2BB3B1" stroke-opacity=".50" stroke-width="3" transform="rotate(58 128 128)"/>
    <circle cx="194" cy="91" r="9" fill="#FF438C"/>
    <circle cx="69" cy="158" r="7" fill="#2BB3B1"/>
    <path d="M87 137c15 22 38 33 69 26" fill="none" stroke="#FFF" stroke-opacity=".42" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>