# Firebase App Hosting configuration for LUMA.
# Keep demo infrastructure intentionally small while preserving Next.js SSR/API routes.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  - variable: SE_VOICE_API_URL
    value: https://se-voice-runtime-2zp4gbirka-uc.a.run.app
    availability:
      - RUNTIME
  - variable: SE_VOICE_AUDIENCE
    value: https://se-voice-runtime-2zp4gbirka-uc.a.run.app
    availability:
      - RUNTIME
  - variable: SE_VOICE_AUTH_MODE
    value: google_oidc
    availability:
      - RUNTIME
  - variable: SE_VOICE_DEFAULT_VOICE
    value: se_instructor_v1
    availability:
      - RUNTIME
  - variable: SE_VOICE_ENGINE
    value: openvoice_v2
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_SE_VOICE_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
